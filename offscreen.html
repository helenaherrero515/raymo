<!DOCTYPE html>
<html>
<head><title>Micro-Screamer Audio Engine</title></head>
<body>
<script>
/* ── Web Audio synth: one wobbly voice per neglected tab ── */

const ctx = new AudioContext();
const voices = {};

chrome.runtime.onMessage.addListener(msg => {
  if (msg.type === 'PLAY_AUDIO')  return playTab(msg.tabId, msg.stage);
  if (msg.type === 'STOP_AUDIO')  return stopTab(msg.tabId);
  if (msg.type === 'STOP_ALL')    return Object.keys(voices).forEach(id => stopTab(Number(id)));
});

/*
  Each stage gets louder, higher-pitched, and harsher.
  Per-tab offset keeps simultaneous screams from blending into one tone.
*/
const STAGES = [
  // 🥺 whimper — soft sine, slow wobble, gentle pulse
  { wave: 'sine',     freq: 180, vol: 0.04, vibHz: 4,  vibD: 25,  tremHz: 1.8, tremD: 0.035 },
  // 😠 annoyed — nasal triangle, faster
  { wave: 'triangle', freq: 280, vol: 0.07, vibHz: 6,  vibD: 45,  tremHz: 3.0, tremD: 0.055 },
  // 😡 angry — harsh sawtooth
  { wave: 'sawtooth', freq: 420, vol: 0.11, vibHz: 8,  vibD: 70,  tremHz: 5.0, tremD: 0.075 },
  // 🤬 full scream — piercing square
  { wave: 'square',   freq: 600, vol: 0.15, vibHz: 12, vibD: 120, tremHz: 8.0, tremD: 0.10  }
];

function playTab(tabId, stage) {
  stopTab(tabId);
  ctx.resume();

  const c = STAGES[stage];
  const offset = (tabId % 7) * 22;          // unique pitch per tab

  // Main oscillator
  const osc = ctx.createOscillator();
  osc.type = c.wave;
  osc.frequency.value = c.freq + offset;

  // Vibrato LFO → pitch wobble
  const vib = ctx.createOscillator();
  vib.frequency.value = c.vibHz + (tabId % 3);
  const vibGain = ctx.createGain();
  vibGain.gain.value = c.vibD;
  vib.connect(vibGain).connect(osc.frequency);

  // Tremolo LFO → volume pulse (sobbing / screaming effect)
  const trem = ctx.createOscillator();
  trem.frequency.value = c.tremHz;
  const tremGain = ctx.createGain();
  tremGain.gain.value = c.tremD;

  // Master gain
  const master = ctx.createGain();
  master.gain.value = c.vol;
  trem.connect(tremGain).connect(master.gain);

  osc.connect(master).connect(ctx.destination);

  osc.start(); vib.start(); trem.start();
  voices[tabId] = { osc, vib, trem };
}

function stopTab(tabId) {
  const v = voices[tabId];
  if (!v) return;
  try { v.osc.stop(); v.vib.stop(); v.trem.stop(); } catch {}
  delete voices[tabId];
}
</script>
</body>
</html>
